name: Deploy Skyline Drop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/checkout@v4
        with:
          repository: falloutmule/single-file-html-software
          ref: 4248c67021e930b7fb4a882f73dfd8ab87df0ee7
          path: .sfhs-core
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .sfhs-core/pnpm-lock.yaml
      - run: pnpm --dir .sfhs-core install --frozen-lockfile
      - name: Install pinned Chromium for canonical browser verification
        run: pnpm --dir .sfhs-core --filter @sfhs/example-skyline-drop exec playwright install --with-deps chromium
      - name: Overlay authoritative game source
        run: |
          rsync -a --delete \
            --exclude .git --exclude .sfhs-core --exclude node_modules --exclude dist \
            --exclude .candidate --exclude test-results --exclude historical \
            ./ .sfhs-core/examples/skyline-drop/
      - name: Pack and verify exact deployment bytes
        run: |
          pnpm --dir .sfhs-core sfhs validate --project examples/skyline-drop --json
          pnpm --dir .sfhs-core --filter @sfhs/example-skyline-drop run test:simulation
          pnpm --dir .sfhs-core sfhs check --project examples/skyline-drop --changed examples/skyline-drop/src --json
          pnpm --dir .sfhs-core sfhs pack --project examples/skyline-drop --json
          pnpm --dir .sfhs-core sfhs verify --project examples/skyline-drop --json
          pnpm --dir .sfhs-core --filter @sfhs/example-skyline-drop run test:browser:canonical
      - name: Prepare Pages artifact
        run: |
          mkdir -p .pages
          cp .sfhs-core/examples/skyline-drop/dist/index.html .pages/index.html
          touch .pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - id: deployment
        uses: actions/deploy-pages@v4
